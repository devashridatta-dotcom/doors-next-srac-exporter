[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doors-next-srac-exporter"
version = "0.1.0"
description = "Read-only SRAC reference exporter for normalized DOORS Next Reportable REST output"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
doors-srac-export = "doors_srac_exporter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

